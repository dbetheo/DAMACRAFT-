name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Versions des outils
        run: |
          swift --version
          xcodebuild -version

      - name: Compiler et créer le .dmg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build.sh dmg

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: DamaCraft-${{ steps.ver.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "DamaCraft ${{ steps.ver.outputs.version }}" \
            --generate-notes
